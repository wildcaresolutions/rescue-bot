name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PRs: share a per-ref group and cancel the in-progress run when a new commit
# is pushed — no point finishing CI on a superseded PR head.
# main pushes: append the commit SHA so every merge gets its OWN group. Pushes
# to main therefore never cancel (cancel-in-progress is false for push) AND
# never queue/evict each other under a shared group. This closes the trap where
# merging two PRs to main within a few minutes let the second push cancel the
# first push's run — silently stranding the first commit's prod deploy. Each
# main commit now deploys on its own run.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: make deps
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: make deps
      - name: Generate Worker bundle inputs (instructions, guides)
        run: |
          node workers/scripts/gen-instructions.js
          node workers/scripts/gen-guides.js
      - name: Type-check Workers
        run: cd workers && npx tsc --noEmit
      - name: Build web UI
        run: make build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: make deps
      # router.test.ts boots the full Worker (incl. routes/chat.ts) which
      # imports the auto-generated instructions/guides modules. Generate
      # them before vitest runs or the import fails.
      - name: Generate Worker bundle inputs (instructions, guides)
        run: |
          node workers/scripts/gen-instructions.js
          node workers/scripts/gen-guides.js
      - run: make test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      # --omit=dev: only audit deps that actually ship in the Worker / web bundle.
      # This is a required gate for deploy-prod, so a high-severity vuln in code
      # we deploy SHOULD block a release. But build/test-only tooling (vite,
      # esbuild, wrangler/miniflare, promptfoo, …) must NOT — an advisory in a
      # dev dependency has no runtime exposure, yet under the old unscoped audit
      # it hard-blocked every prod deploy, including pure prompt fixes (this is
      # exactly what stranded the location-grounding fix in #85). evals/ and
      # infra/watchdog/ are not audited here at all — they're separate dev/cron
      # tooling, not part of the shipped product.
      - run: npm audit --audit-level=high --omit=dev
      - run: cd workers && npm audit --audit-level=high --omit=dev
      - run: cd web && npm audit --audit-level=high --omit=dev

  widget-e2e:
    name: Widget E2E (cross-origin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Self-contained: the spec boots its own HTTP server on a random port
      # and points the embedded widget at the prod bundle. No wrangler dev
      # needed. Just install Chromium and run.
      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium
      - name: Run widget E2E
        run: npm run e2e:widget

  verify-stub:
    name: Verify wrangler.toml stub matches template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      # No deps install needed — gen-wrangler.js has zero npm dependencies.
      # Catches the case where someone edits wrangler.template.toml but forgets
      # to regenerate the committed wrangler.toml stub (the gateway file IDE
      # tooling reads on a fresh clone). cf-verify-stub diffs the committed
      # file against `gen-wrangler --stub` output and fails CI if they drift.
      - run: make cf-verify-stub

  deploy-test:
    name: Deploy → test env (workers.dev)
    needs: [lint, build, test, audit, verify-stub]
    # Skip on dependabot PRs — they don't have access to the `test` environment
    # secrets (ORG_SLUG, ACCOUNT_ID, etc.), so gen-wrangler.js fails before
    # wrangler is even invoked. The actual test-env deploy fires when the bump
    # lands on main.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: test
    # Job-level concurrency: serialize test deploys across PRs so two open PRs
    # don't stomp each other on the shared test worker. Workflow-level
    # concurrency above (cancel-in-progress per branch) stacks with this —
    # they don't override each other.
    concurrency:
      group: deploy-test-shared
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: make deps
      - name: Deploy test env
        run: make cf-deploy-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Typed per-value secrets. gen-wrangler.js reads from process.env
          # inside cf-render-config (chained from cf-migrate → cf-deploy*)
          # and writes the real values into workers/wrangler.toml before
          # any wrangler invocation.
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ORG_SLUG: ${{ secrets.ORG_SLUG }}
          ORG_DOMAIN: ${{ secrets.ORG_DOMAIN }}
          AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          DEV_D1_DATABASE_ID: ${{ secrets.DEV_D1_DATABASE_ID }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          PROD_D1_DATABASE_ID: ${{ secrets.PROD_D1_DATABASE_ID }}
          PROD_TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          PLATFORM_NAME: ${{ secrets.PLATFORM_NAME }}
          PLATFORM_EMBED_HOST: ${{ secrets.PLATFORM_EMBED_HOST }}
          # Plaintext [vars] now (was a wrangler secret). Also the platform-admin
          # login allowlist (lib/auth.ts:isPlatformAdminEmail) — an empty render
          # would lock every platform admin out, so it MUST be passed here.
          PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }}
          MAIN_CHAT_MODEL: ${{ secrets.MAIN_CHAT_MODEL }}
          PHOTO_RECOGNIZER_MODEL: ${{ secrets.PHOTO_RECOGNIZER_MODEL }}
      # No smoke tests on the test env — smoke runs against prod only (after
      # deploy-prod on main). PR deploys rely on widget-e2e + unit tests.

  deploy-prod:
    name: Deploy → production
    needs: [lint, build, test, audit, verify-stub]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: make deps
      - name: Deploy production
        run: make cf-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ORG_SLUG: ${{ secrets.ORG_SLUG }}
          ORG_DOMAIN: ${{ secrets.ORG_DOMAIN }}
          AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          DEV_D1_DATABASE_ID: ${{ secrets.DEV_D1_DATABASE_ID }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          PROD_D1_DATABASE_ID: ${{ secrets.PROD_D1_DATABASE_ID }}
          PROD_TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          PLATFORM_NAME: ${{ secrets.PLATFORM_NAME }}
          PLATFORM_EMBED_HOST: ${{ secrets.PLATFORM_EMBED_HOST }}
          # Plaintext [vars] now (was a wrangler secret). Also the platform-admin
          # login allowlist (lib/auth.ts:isPlatformAdminEmail) — an empty render
          # would lock every platform admin out, so it MUST be passed here.
          PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }}
          MAIN_CHAT_MODEL: ${{ secrets.MAIN_CHAT_MODEL }}
          PHOTO_RECOGNIZER_MODEL: ${{ secrets.PHOTO_RECOGNIZER_MODEL }}
          # Lets deploy-embed.js purge the embed CDN's rolling keys (v1.js /
          # widget.js) so a freshly deployed widget isn't masked by the edge
          # cache for hours. Requires the CLOUDFLARE_API_TOKEN to also have
          # Zone → Cache Purge. Missing/insufficient → deploy-embed warns,
          # doesn't fail.
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      # Public-URL smoke tests run in the `smoke` job below — uses Chromium's
      # real TLS fingerprint (page.evaluate fetch) to bypass CF Bot Fight Mode.

  smoke:
    name: Smoke tests → production
    needs: [deploy-prod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Render wrangler.toml (required before wrangler d1 execute)
        # The committed wrangler.toml is the stub form. gen-wrangler.js renders
        # it with real values from CI secrets so wrangler can resolve 'wildcare-db'
        # to its production database ID. Same step deploy-prod does via cf-render-config.
        run: node workers/scripts/gen-wrangler.js
        env:
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ORG_SLUG: ${{ secrets.ORG_SLUG }}
          ORG_DOMAIN: ${{ secrets.ORG_DOMAIN }}
          AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          DEV_D1_DATABASE_ID: ${{ secrets.DEV_D1_DATABASE_ID }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          PROD_D1_DATABASE_ID: ${{ secrets.PROD_D1_DATABASE_ID }}
          PROD_TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          PLATFORM_NAME: ${{ secrets.PLATFORM_NAME }}
          PLATFORM_EMBED_HOST: ${{ secrets.PLATFORM_EMBED_HOST }}
          PLATFORM_ADMIN_EMAILS: ${{ secrets.PLATFORM_ADMIN_EMAILS }}
      - name: Seed smoke.wildcaresolutions.org into allowed_domains
        # Idempotent INSERT OR IGNORE — safe to run on every push. Ensures the
        # smoke subdomain is always allowed before the CORS tests run, without
        # manual setup steps or drift risk. Uses a subquery to avoid hardcoding
        # the tenant UUID (slug is stable; UUID is not).
        run: |
          cd workers && npx wrangler d1 execute wildcare-db --env production --remote --command \
            "INSERT OR IGNORE INTO allowed_domains (tenant_id, domain) SELECT id, 'smoke.wildcaresolutions.org' FROM tenants WHERE slug = 'wildcare'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ORG_SLUG: ${{ secrets.ORG_SLUG }}
          ORG_DOMAIN: ${{ secrets.ORG_DOMAIN }}
          AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          DEV_D1_DATABASE_ID: ${{ secrets.DEV_D1_DATABASE_ID }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          PROD_D1_DATABASE_ID: ${{ secrets.PROD_D1_DATABASE_ID }}
      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm run e2e:smoke
      - name: Rollback production on smoke failure
        if: failure()
        # Smoke tests failed after a successful deploy — roll back to the
        # previous Worker version automatically. wrangler.toml is already
        # rendered by the earlier step so wrangler can resolve the env.
        run: |
          echo "Smoke tests failed — rolling back production Worker to previous version"
          cd workers && npx wrangler rollback --env production --message "auto-rollback: smoke tests failed on ${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-watchdog:
    name: Deploy → watchdog (independent /health prober)
    needs: [lint, build, test, audit, verify-stub]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Independent failure domain from the main worker — its whole purpose is
    # to page on outage. Deploy from the same push that produces a new prod
    # worker so the watchdog's idea of "what should be up" matches reality.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: make deps
      - name: Deploy watchdog
        run: make cf-deploy-watchdog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ORG_SLUG: ${{ secrets.ORG_SLUG }}
          WATCHDOG_KV_ID: ${{ secrets.WATCHDOG_KV_ID }}
          WATCHDOG_HEALTH_URL_TEST: ${{ secrets.WATCHDOG_HEALTH_URL_TEST }}
          WATCHDOG_HEALTH_URL_PROD: ${{ secrets.WATCHDOG_HEALTH_URL_PROD }}
      # Watchdog secrets (OPS_EMAIL, OPS_FROM_EMAIL) are pushed once via
      # `make cf-push-secrets-watchdog` from a developer machine and persist
      # across redeploys. The CI deploy doesn't push them — wrangler retains
      # existing secrets when only the code is updated.
