name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same branch when a new push lands.
# Avoids stacking deploys when you push twice in quick succession.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: make deps
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: make deps
      - name: Generate Worker bundle inputs (instructions, guides)
        run: |
          node workers/scripts/gen-instructions.js
          node workers/scripts/gen-guides.js
      - name: Type-check Workers
        run: cd workers && npx tsc --noEmit
      - name: Build web UI
        run: make build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: make deps
      # router.test.ts boots the full Worker (incl. routes/chat.ts) which
      # imports the auto-generated instructions/guides modules. Generate
      # them before vitest runs or the import fails.
      - name: Generate Worker bundle inputs (instructions, guides)
        run: |
          node workers/scripts/gen-instructions.js
          node workers/scripts/gen-guides.js
      - run: make test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm audit --audit-level=high
      - run: cd workers && npm audit --audit-level=high
      - run: cd web && npm audit --audit-level=high

  verify-stub:
    name: Verify wrangler.toml stub matches template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      # No deps install needed — gen-wrangler.js has zero npm dependencies.
      # Catches the case where someone edits wrangler.template.toml but forgets
      # to regenerate the committed wrangler.toml stub (the gateway file IDE
      # tooling reads on a fresh clone). cf-verify-stub diffs the committed
      # file against `gen-wrangler --stub` output and fails CI if they drift.
      - run: make cf-verify-stub

  deploy-test:
    name: Deploy → test env (workers.dev)
    needs: [lint, build, test, audit, verify-stub]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    # Job-level concurrency: serialize test deploys across PRs so two open PRs
    # don't stomp each other on the shared test worker. Workflow-level
    # concurrency above (cancel-in-progress per branch) stacks with this —
    # they don't override each other.
    concurrency:
      group: deploy-test-shared
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: make deps
      - name: Deploy test env
        run: make cf-deploy-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Typed per-value secrets. gen-wrangler.js reads from process.env
          # inside cf-render-config (chained from cf-migrate → cf-deploy*)
          # and writes the real values into workers/wrangler.toml before
          # any wrangler invocation.
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ORG_SLUG: ${{ secrets.ORG_SLUG }}
          ORG_DOMAIN: ${{ secrets.ORG_DOMAIN }}
          AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          DEV_D1_DATABASE_ID: ${{ secrets.DEV_D1_DATABASE_ID }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          PROD_D1_DATABASE_ID: ${{ secrets.PROD_D1_DATABASE_ID }}
          PROD_TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          PLATFORM_NAME: ${{ secrets.PLATFORM_NAME }}
          PLATFORM_EMBED_HOST: ${{ secrets.PLATFORM_EMBED_HOST }}
      # No public-URL smoke test — CF blocks GHA runner IPs at the edge
      # (Bot Fight Mode / WAF) so probing from CI returns 403 even when
      # the deploy is healthy. The wrangler deploy step's exit code is
      # the authoritative success signal; runtime health is monitored
      # separately. See history before bcb4409 for the iteration.

  deploy-prod:
    name: Deploy → production
    needs: [lint, build, test, audit, verify-stub]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: make deps
      - name: Deploy production
        run: make cf-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ORG_SLUG: ${{ secrets.ORG_SLUG }}
          ORG_DOMAIN: ${{ secrets.ORG_DOMAIN }}
          AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          DEV_D1_DATABASE_ID: ${{ secrets.DEV_D1_DATABASE_ID }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          PROD_D1_DATABASE_ID: ${{ secrets.PROD_D1_DATABASE_ID }}
          PROD_TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          PLATFORM_NAME: ${{ secrets.PLATFORM_NAME }}
          PLATFORM_EMBED_HOST: ${{ secrets.PLATFORM_EMBED_HOST }}
      # No public-URL smoke test — CF blocks GHA runner IPs at the edge
      # (Bot Fight Mode / WAF) so probing from CI returns 403 even when
      # the deploy is healthy. The wrangler deploy step's exit code is
      # the authoritative success signal; runtime health is monitored
      # separately. See history before bcb4409 for the iteration.

  deploy-watchdog:
    name: Deploy → watchdog (independent /health prober)
    needs: [lint, build, test, audit, verify-stub]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Independent failure domain from the main worker — its whole purpose is
    # to page on outage. Deploy from the same push that produces a new prod
    # worker so the watchdog's idea of "what should be up" matches reality.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: make deps
      - name: Deploy watchdog
        run: make cf-deploy-watchdog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          ORG_SLUG: ${{ secrets.ORG_SLUG }}
          WATCHDOG_KV_ID: ${{ secrets.WATCHDOG_KV_ID }}
          WATCHDOG_HEALTH_URL_TEST: ${{ secrets.WATCHDOG_HEALTH_URL_TEST }}
          WATCHDOG_HEALTH_URL_PROD: ${{ secrets.WATCHDOG_HEALTH_URL_PROD }}
      # Watchdog secrets (OPS_EMAIL, OPS_FROM_EMAIL) are pushed once via
      # `make cf-push-secrets-watchdog` from a developer machine and persist
      # across redeploys. The CI deploy doesn't push them — wrangler retains
      # existing secrets when only the code is updated.
