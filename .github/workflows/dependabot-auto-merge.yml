name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

# The merge must NOT be performed with GITHUB_TOKEN: GitHub suppresses workflow
# runs for pushes made by GITHUB_TOKEN, so the squash-merge onto main would
# never start ci.yml and deploy-prod would silently never run (prod drifted 22
# commits behind main this way in Nov 2026). Auto-merge is attributed to the
# actor that enabled it, so enabling it with a GitHub App installation token
# makes the eventual merge a normal push that triggers CI + deploy.
#
# Requires two DEPENDABOT secrets (not Actions secrets — Dependabot-triggered
# runs can only read the Dependabot secret store):
#   AUTOMERGE_APP_CLIENT_ID    — the GitHub App's Client ID
#   AUTOMERGE_APP_PRIVATE_KEY  — a private key (.pem contents) for the App
# The App needs repository permissions Contents: write + Pull requests: write
# and must be installed on this repository.

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Check GitHub App secrets
        env:
          CLIENT_ID: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::AUTOMERGE_APP_CLIENT_ID / AUTOMERGE_APP_PRIVATE_KEY Dependabot secrets are not set. Refusing to auto-merge with GITHUB_TOKEN because that merge would not trigger the production deploy. Merge this PR manually or configure the secrets."
            exit 1
          fi

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge (squash)
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
