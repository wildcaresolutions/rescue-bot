server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    # Serve static files
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to agent container
    location /api/ {
        set $upstream_agent agent:8080;
        proxy_pass http://$upstream_agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Feedback API proxy to feedback container
    location /feedback/ {
        set $upstream_feedback feedback:3001;
        proxy_pass http://$upstream_feedback/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve index.html for all routes (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
